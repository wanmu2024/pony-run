<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>小马快跑 · pony-run</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e1116; --card:#171b23; --line:#252b36; --fg:#d7dde6; --dim:#8a94a6;
          --acc:#4f8cff; --ok:#3ddc84; --off:#6b7280; --warn:#e6b455; --err:#ef6a6a; --pony:#ffb347; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:22px 20px 12px; max-width:1000px; margin:0 auto; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  h1 .en { color:var(--dim); font-weight:400; font-size:14px; margin-left:8px; }
  h1 .logo { color:var(--pony); }
  .sub { color:var(--dim); margin:6px 0 0; font-size:13px; }
  .hostline { margin-top:10px; font-size:12px; color:var(--dim); }
  .hostline b { color:var(--fg); font-weight:600; }
  main { max-width:1000px; margin:0 auto; padding:8px 20px 30px;
         display:grid; grid-template-columns:repeat(auto-fit, minmax(270px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; }
  .card .top { display:flex; align-items:center; gap:8px; }
  .idx { width:22px; height:22px; border-radius:50%; background:#222a36; color:var(--dim); font-size:12px;
         display:inline-flex; align-items:center; justify-content:center; flex:none; }
  .card h2 { font-size:16px; margin:0; }
  .card .en { color:var(--dim); font-size:11px; font-weight:400; }
  .desc { color:var(--dim); font-size:13px; min-height:38px; }
  .status { display:flex; align-items:center; gap:7px; font-size:13px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--off); flex:none; }
  .dot.online { background:var(--ok); box-shadow:0 0 8px rgba(61,220,132,.7); }
  .dot.offline { background:var(--off); }
  .dot.unknown { background:var(--warn); }
  .badge { background:var(--pony); color:#1a1206; border-radius:99px; padding:1px 8px; font-size:11px; font-weight:700; }
  .status .txt { color:var(--dim); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; }
  a.btn, button.btn { display:inline-flex; align-items:center; gap:6px; border-radius:9px; padding:8px 14px;
        font-size:13px; cursor:pointer; text-decoration:none; border:1px solid var(--line);
        background:var(--bg); color:var(--fg); }
  a.btn.primary, button.btn.primary { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  a.btn:hover, button.btn:hover { border-color:var(--acc); }
  a.btn.disabled { opacity:.45; pointer-events:none; }
  .path { font:12px/1.5 Consolas,monospace; color:var(--dim); background:var(--bg); border:1px dashed var(--line);
          border-radius:8px; padding:6px 8px; word-break:break-all; user-select:all; }
  .hint { max-width:1000px; margin:0 auto; padding:0 20px 26px; }
  .hint .box { background:#1b2330; border:1px solid #2b3a52; border-radius:12px; padding:12px 14px; font-size:13px; }
  .hint .box h3 { margin:0 0 8px; font-size:13px; color:var(--acc); }
  .hint .box + .box { margin-top:10px; }
  .hint code { background:#0a0d12; border:1px solid var(--line); border-radius:5px; padding:1px 6px;
               font:12px Consolas,monospace; user-select:all; }
  footer { max-width:1000px; margin:0 auto; padding:0 20px 40px; color:var(--dim); font-size:12px; }
  footer table { border-collapse:collapse; margin-top:8px; }
  footer td, footer th { border:1px solid var(--line); padding:4px 10px; text-align:left; font-weight:400; }
  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:#233; border:1px solid var(--acc);
           color:#dfe9ff; padding:9px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  @media (max-width:640px) { header { padding-top:16px; } h1 { font-size:19px; } .desc { min-height:0; } }
</style>
</head>
<body>
<header>
  <h1><span class="logo">🐎</span> 小马快跑 <span class="en">pony-run</span></h1>
  <p class="sub">GPT ⇄ Claude Code 工具台 · 三个模块的统一入口</p>
  <div class="hostline">当前入口：<b id="hostinfo">检测中…</b> · <a href="#" id="refresh" style="color:var(--acc)">重新检测</a> · <a href="#" id="helpLink" style="color:var(--acc)">使用文档</a></div>
</header>

<main id="cards"></main>

<section class="hint" id="hint"></section>

<footer>
  <div>端口一览（本机）：</div>
  <table>
    <tr><th>端口</th><th>用途</th><th>模块</th></tr>
    <tr><td>8800</td><td>手机页 / 审批 / 门户托管</td><td>远程通道 CCremote</td></tr>
    <tr><td>7800</td><td>本地 agent（执行与审批）</td><td>远程通道 CCremote</td></tr>
    <tr><td>8765</td><td>循环面板（默认仅本机）</td><td>循环引擎 gpt-cc-loop</td></tr>
    <tr><td>9223</td><td>Chrome 调试口（页面自动化）</td><td>循环引擎 gpt-cc-loop</td></tr>
  </table>
  <p style="margin-top:10px">提示：手机访问请用 <code>http://本机IP:8800/pony</code>（需 relay 已启动）。</p>
</footer>

<div class="toast" id="toast"></div>

<script>
// ── 配置区（改这里即可；也支持 URL 参数覆盖，如 ?host=192.168.1.5）──
const CONFIG = {
  probeIntervalMs: 6000,
  probeTimeoutMs: 3500,
  // 面板开了局域网访问时的口令（见 gpt-cc-loop/runs/dashboard-token.txt）；
  // 也可用门户 URL 参数直接带入：http://本机IP:8800/pony?k=口令
  panelToken: "",
  modules: [
    {
      key: "perm", idx: "①", name: "权限中枢", en: "claude-permission-manager",
      desc: "风险规则与审批策略的核心数据源（VS Code 扩展，无独立网页）",
      kind: "local", statusHint: "随 VS Code 启动，无需常驻服务",
      pathText: "d:\\Al_Learning\\claude-permission-manager\\src\\rules",
      copyItems: [
        { label: "复制规则目录", text: "d:\\Al_Learning\\claude-permission-manager\\src\\rules" },
        { label: "复制打开命令", text: "code d:\\Al_Learning\\claude-permission-manager" },
      ],
    },
    {
      key: "loop", idx: "②", name: "循环引擎", en: "gpt-cc-loop",
      desc: "GPT 下指令 → Claude Code 执行 → 结果自动回传，直到出现停止词",
      kind: "http", port: 8765, path: "/", linkLabel: "打开面板",
      startHint: "启动：双击 pony-run\\start.cmd 一键拉起（或单独 node loop.mjs serve）",
      localOnlyNote: "面板默认仅本机可访问（手机访问需在 gpt-cc-loop 配置里开启局域网）",
    },
    {
      key: "remote", idx: "③", name: "远程通道", en: "cc-remote / CCRemote",
      desc: "手机远程操控与权限审批；也是本产品手机端的网络通路",
      kind: "http", port: 8800, path: "/", linkLabel: "打开手机页",
      startHint: "启动：双击 pony-run\\start.cmd 一键拉起（agent 与 relay 都会起）",
    },
  ],
};

// ── URL 参数覆盖 ──
const params = new URLSearchParams(location.search);
const forcedHost = params.get("host");

function isLocalHost() {
  const h = location.hostname;
  return !h || h === "localhost" || h === "127.0.0.1" || location.protocol === "file:";
}
function hostOf(mod) {
  if (forcedHost) return forcedHost;
  if (mod.hostOverride) return mod.hostOverride;
  return (isLocalHost() ? "127.0.0.1" : location.hostname) + ":" + mod.port;
}
function urlOf(mod) {
  // 本机打开 → 直连各模块端口；经公网/局域网入口打开 → 走同源路径（relay 已反代面板）
  const base = isLocalHost()
    ? (location.protocol === "file:" ? "http://" : location.protocol + "//") + hostOf(mod) + mod.path
    : location.origin + (mod.key === "loop" ? "/panel" + mod.path : mod.path);
  const tok = mod.key === "loop" ? (params.get("k") || CONFIG.panelToken || "") : "";
  return tok ? base + "?k=" + encodeURIComponent(tok) : base;
}

// ── 状态探测（no-cors fetch；实测 file:// 与 http 下都可用，iframe 方案会误报已弃用）──
async function probe(url, timeoutMs) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    await fetch(url, { mode: "no-cors", cache: "no-store", signal: ctl.signal });
    return true;
  } catch {
    return false;
  } finally {
    clearTimeout(t);
  }
}

// ── 渲染 ──
const state = {}; // key -> "online"|"offline"|"unknown"|"na"
let relayStatus = null; // 由 relay 的 /api/portal-status 提供的真实状态（同源时可用）

async function fetchRelayStatus() {
  if (location.protocol === "file:") return null; // file:// 打开时无法读（跨源）
  try {
    const r = await fetch("/api/portal-status", { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch {
    return null;
  }
}

function render() {
  const cards = document.getElementById("cards");
  cards.innerHTML = CONFIG.modules.map((m) => {
    let st = state[m.key] || "unknown";
    let extra = "";
    let badge = "";
    if (m.key === "remote" && relayStatus) {
      // 经 relay 打开时用真实数据（无需猜测）
      st = relayStatus.machineOnline ? "online" : "offline";
      extra = ` · 待审批 ${relayStatus.pendingPermissions} 条 · 会话 ${relayStatus.conversations}`;
      if (relayStatus.pendingPermissions > 0) badge = `<span class="badge">有待办</span>`;
    } else if (m.key === "loop" && !isLocalHost() && !params.get("k") && !CONFIG.panelToken) {
      extra = st === "offline" ? " · 手机访问面板需先开局域网+口令（见 README）" : " · 手机访问需口令（门户 URL 加 ?k=）";
    } else if (st === "offline" && m.localOnlyNote && !isLocalHost()) {
      extra = " · " + m.localOnlyNote;
    }
    const dot = `<span class="dot ${st}"></span>`;
    const label = { online: "在线", offline: "离线", unknown: "检测中…", na: "无需常驻" }[st];
    let actions = "";
    if (m.kind === "http") {
      const u = urlOf(m);
      actions = `<a class="btn primary ${st === "offline" ? "disabled" : ""}" href="${u}" target="_blank" rel="noopener">${m.linkLabel} →</a>`
              + `<button class="btn" data-copy="${u}" title="复制地址">复制地址</button>`;
    } else {
      actions = (m.copyItems || []).map((c) => `<button class="btn" data-copy="${escapeAttr(c.text)}">${c.label}</button>`).join("");
    }
    return `<div class="card">
      <div class="top"><span class="idx">${m.idx}</span><h2>${m.name} <span class="en">${m.en}</span></h2>${badge}</div>
      <div class="desc">${m.desc}</div>
      <div class="status">${dot}<span class="txt">${label}${extra}</span></div>
      ${m.pathText ? `<div class="path">${m.pathText}</div>` : ""}
      <div class="actions">${actions}</div>
    </div>`;
  }).join("");
  cards.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => copy(b.dataset.copy)));
  renderHint();
}

function renderHint() {
  const off = CONFIG.modules.filter((m) => m.kind === "http" && state[m.key] === "offline");
  const box = document.getElementById("hint");
  if (!off.length) { box.innerHTML = ""; return; }
  box.innerHTML = off.map((m) => `<div class="box"><h3>${m.name} 离线</h3>
      <div>${m.startHint || ""}</div>
      ${m.startHint ? `<div style="margin-top:8px"><button class="btn" data-copy="${escapeAttr(m.startHint.split("：")[1] || m.startHint)}">复制启动命令</button></div>` : ""}
    </div>`).join("");
  box.querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", () => copy(b.dataset.copy)));
}

function escapeAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1600);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("已复制"); }
  catch { toast("复制失败，请手动选中路径复制"); }
}

async function probeAll() {
  relayStatus = await fetchRelayStatus(); // 同源（经 relay 打开）时拿到真实状态
  for (const m of CONFIG.modules) {
    if (m.kind !== "http") { state[m.key] = "na"; continue; }
    state[m.key] = "unknown"; render();
    const ok = await probe(urlOf(m), CONFIG.probeTimeoutMs);
    state[m.key] = ok ? "online" : "offline";
    render();
  }
}

document.getElementById("hostinfo").textContent =
  (isLocalHost() ? "本机（localhost）" : "局域网：" + location.hostname) + (forcedHost ? " · 已指定 host=" + forcedHost : "");
document.getElementById("refresh").addEventListener("click", (e) => { e.preventDefault(); probeAll(); });
// 使用文档在循环引擎面板上（自动带上主机与门户口令）
document.getElementById("helpLink").href = urlOf({ key: "loop", port: 8765, path: "/help" });
render();
probeAll();
setInterval(probeAll, CONFIG.probeIntervalMs);
</script>
</body>
</html>
