<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小马快跑 · 产品设计 demo v3</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{
    --bg:#0d1015; --surface:#161a21; --surface2:#1d222b; --surface3:#242a35;
    --line:#2a3140; --line2:#39414f;
    --fg:#e6ebf2; --fg2:#a8b2c1; --dim:#6d7887;
    --acc:#5b8def; --acc-soft:rgba(91,141,239,.14);
    --ok:#3fbf7f; --warn:#e0a44a; --danger:#e8695f; --git:#c99ae8;
    --r:14px; --r-sm:10px;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:#080a0e; color:var(--fg); min-height:100vh;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px 14px 30px;
  }

  /* ══ 演示控制条（不属于产品） ══ */
  .demobar{
    width:100%; max-width:1180px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    background:#12161d; border:1px dashed #313a4a; border-radius:12px; padding:10px 12px;
  }
  .demobar .tag{font-size:11px; color:var(--dim); letter-spacing:.5px; margin-right:2px;}
  .demo-btn{
    background:#1b212b; border:1px solid #2f3745; color:var(--fg2); font-size:12.5px;
    padding:6px 11px; border-radius:8px; cursor:pointer; font-family:inherit;
  }
  .demo-btn:hover{border-color:var(--acc); color:var(--fg);}
  .demo-btn.on{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600;}
  .demobar .sep{flex:1;}

  /* ══ 设备外壳 ══ */
  .device{background:var(--bg); color:var(--fg); display:flex; overflow:hidden; position:relative;}
  body.mode-phone .device{width:392px; height:812px; border:11px solid #1c222c; border-radius:42px; box-shadow:var(--shadow),0 0 0 1px #2b3340;}
  body.mode-desktop .device{width:100%; max-width:1180px; height:min(840px,88vh); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);}
  @media (max-width:760px){
    body{padding:0;}
    body.mode-phone .device{width:100%; height:100vh; border:0; border-radius:0;}
    .demobar{margin:10px; width:auto; align-self:stretch;}
  }

  .col{display:flex; flex-direction:column; flex:1; min-width:0; min-height:0;}
  .appbar{
    display:flex; align-items:center; gap:10px; padding:14px 16px 12px; flex:none;
    border-bottom:1px solid var(--line);
  }
  body.mode-desktop .appbar{padding:16px 24px 13px;}
  .appbar h1{margin:0; font-size:17px; font-weight:700; flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  body.mode-desktop .appbar h1{font-size:19px;}
  .appbar .sub{font-size:12.5px; color:var(--dim); font-weight:400; margin-left:7px;}
  .back{
    background:var(--surface2); border:1px solid var(--line); color:var(--fg2);
    min-width:32px; height:32px; border-radius:9px; cursor:pointer; font-size:15px; flex:none;
    display:flex; align-items:center; justify-content:center; padding:0 9px; font-family:inherit;
  }
  .back:hover{border-color:var(--acc); color:var(--fg);}

  .netbar{
    display:flex; align-items:center; gap:8px; padding:9px 16px; font-size:12.5px; flex:none;
    background:var(--surface); border-bottom:1px solid var(--line); color:var(--fg2);
  }
  body.mode-desktop .netbar{padding:9px 24px;}
  .netbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 7px rgba(63,191,127,.8);}
  .netbar.off{background:rgba(232,105,95,.1); color:#f0a49c;}
  .netbar.off .dot{background:var(--danger); box-shadow:none;}

  main{flex:1; overflow-y:auto; overscroll-behavior:contain; min-height:0;}
  .pad{padding:16px;}
  body.mode-desktop .pad{padding:22px 24px 50px;}
  body.mode-desktop .pad > .inner{max-width:800px; margin:0 auto;}

  /* ══ 门户 ══ */
  .hero{padding:26px 20px 6px; text-align:center;}
  body.mode-desktop .hero{padding:34px 24px 10px;}
  .hero .mark{font-size:36px; line-height:1;}
  .hero h1{margin:12px 0 5px; font-size:23px; font-weight:750; letter-spacing:.3px;}
  body.mode-desktop .hero h1{font-size:27px;}
  .hero p{margin:0; color:var(--dim); font-size:13.5px;}

  .mods{display:flex; flex-direction:column; gap:12px; padding:18px 16px 40px;}
  body.mode-desktop .mods{max-width:720px; margin:0 auto; padding:24px 24px 50px; gap:13px;}
  .mod{
    background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:17px 18px; cursor:pointer; transition:.14s; text-align:left; font-family:inherit;
    color:inherit; width:100%; display:block;
  }
  .mod:hover{border-color:var(--acc); background:var(--surface2); transform:translateY(-1px);}
  .mod .hd{display:flex; align-items:center; gap:11px; margin-bottom:8px;}
  .mod .ico{
    width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;
    justify-content:center;font-size:19px;background:var(--surface3);
  }
  .mod h3{margin:0; font-size:16.5px; font-weight:700; flex:1;}
  .mod .en{font-size:11px; color:var(--dim); font-weight:400; display:block; margin-top:2px;}
  .mod .go{color:var(--dim); font-size:19px;}
  .mod .desc{color:var(--fg2); font-size:13.5px; line-height:1.6; margin:0 0 11px;}
  .mod .stat{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--dim); flex-wrap:wrap;}
  .mod .stat .s{display:inline-flex; align-items:center; gap:5px;}
  .mod .stat .s + .s::before{content:"·"; margin-right:5px; color:var(--line2);}

  /* ══ 通用 ══ */
  .pill{font-size:11px;padding:2.5px 8px;border-radius:99px;font-weight:600;flex:none;
    border:1px solid transparent;white-space:nowrap;}
  .pill.warn{background:rgba(224,164,74,.16);color:var(--warn);border-color:rgba(224,164,74,.3);}
  .pill.ok{background:rgba(63,191,127,.15);color:var(--ok);border-color:rgba(63,191,127,.28);}
  .pill.acc{background:var(--acc-soft);color:var(--acc);border-color:rgba(91,141,239,.3);}
  .pill.dim{background:var(--surface3);color:var(--dim);border-color:var(--line);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;margin-bottom:11px;}
  .row{display:flex;align-items:center;gap:9px;}
  .grow{flex:1;min-width:0;}
  .meta{color:var(--dim);font-size:12.5px;line-height:1.55;}
  h3.t{margin:0;font-size:15px;font-weight:650;line-height:1.45;}

  .sechead{display:flex;align-items:baseline;gap:9px;margin:20px 0 10px;font-size:12.5px;color:var(--dim);}
  .sechead:first-child{margin-top:2px;}
  .sechead b{color:var(--fg2);font-weight:600;}
  .sechead .rule{flex:1;height:1px;background:var(--line);}

  .btn{font:inherit;font-size:13.5px;font-weight:600;border-radius:var(--r-sm);padding:10px 16px;
    cursor:pointer;border:1px solid var(--line2);background:var(--surface2);color:var(--fg);transition:.12s;}
  .btn:hover{border-color:var(--acc);}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;}
  .btn.pri:hover{background:#4b7ee0;}
  .btn.deny{background:transparent;color:var(--fg2);}
  .btn.deny:hover{border-color:var(--danger);color:var(--danger);}
  .btn.sm{padding:7px 12px;font-size:12.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* ══ 模块：两栏 ══ */
  .split{display:flex; flex:1; min-height:0;}
  body.mode-desktop .split{flex-direction:row;}
  .pane-list{border-right:1px solid var(--line); overflow-y:auto; min-height:0;}
  body.mode-phone .pane-list{width:100%; flex:1;}
  body.mode-desktop .pane-list{width:290px; flex:none;}
  .pane-detail{display:flex; flex-direction:column; flex:1; min-width:0; min-height:0;}
  body.mode-phone .split.onlylist .pane-detail{display:none;}
  body.mode-phone .split.onlydetail .pane-list{display:none;}

  /* 电脑端可以把列表整栏收起来，把地方让给对话 */
  body.mode-desktop .split.nolist .pane-list{display:none;}

  .listhead{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);}
  .listhead b{font-size:12.5px;color:var(--fg2);font-weight:600;flex:1;letter-spacing:.3px;}
  .lbtn{
    background:var(--surface2);border:1px solid var(--line);color:var(--fg2);
    width:26px;height:26px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;flex:none;font-family:inherit;padding:0;
  }
  .lbtn:hover{border-color:var(--acc);color:var(--fg);}

  .litem{padding:13px 15px; border-bottom:1px solid var(--line); cursor:pointer; transition:.12s;}
  .litem:hover{background:var(--surface2);}
  .litem.on{background:var(--acc-soft); box-shadow:inset 3px 0 0 var(--acc);}
  .litem .nm{font-size:14.5px;font-weight:600;margin-bottom:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .litem .sb{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;}

  /* ══ 锁 ══ */
  .lockbar{
    display:flex; align-items:center; gap:9px; padding:10px 16px; font-size:12.5px; flex:none;
    border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap;
  }
  body.mode-desktop .lockbar{padding:10px 24px;}
  .lockbar.mine{background:rgba(63,191,127,.09); color:#9fe3bf;}
  .lockbar.other{background:rgba(224,164,74,.1); color:#eec98a;}
  .lockbar .ic{font-size:13px;}
  .lockbar .txt{color:inherit;}
  .lockbar .hint{color:inherit; opacity:.62; font-size:11.5px;}
  .lockbar .sp{flex:1;}
  .lkbtn{
    background:rgba(255,255,255,.07);border:1px solid currentColor;color:inherit;
    font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;opacity:.92;
  }
  .lkbtn:hover{opacity:1;background:rgba(255,255,255,.16);}

  /* ══ 抽屉（怎么跑 / 设置） ══ */
  .drawer{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;margin-bottom:11px;}
  .drawer-hd{display:flex;align-items:center;gap:9px;width:100%;padding:12px 15px;
    background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;}
  .drawer-hd:hover{background:var(--surface2);}
  .drawer-hd .chev{color:var(--dim);font-size:10px;flex:none;transition:transform .18s;}
  .drawer.open .drawer-hd .chev{transform:rotate(90deg);}
  .drawer-hd .t{font-size:13.5px;font-weight:600;flex:none;}
  .drawer-hd .sum{font-size:12.5px;color:var(--dim);flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .drawer-hd .tail{font-size:12px;color:var(--acc);flex:none;}
  .drawer-bd{display:none;border-top:1px solid var(--line);}
  .drawer.open .drawer-bd{display:block;}

  /* ══ 步骤面板 ══ */
  .steps{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:11px;}
  .step{display:flex;gap:12px;padding:14px 16px;}
  .step + .step{border-top:1px solid var(--line);}
  .step .n{
    width:21px;height:21px;border-radius:50%;background:var(--surface3);color:var(--fg2);
    font-size:11.5px;font-weight:700;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .step .lb{font-size:12.5px;color:var(--fg2);font-weight:600;margin-bottom:9px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    font:inherit;font-size:13px;padding:7px 13px;border-radius:9px;background:var(--bg);
    border:1px solid var(--line);color:var(--fg2);cursor:pointer;
  }
  .chip:hover{border-color:var(--acc);color:var(--fg);}
  .chip.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600;}
  .dirpick{
    display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--line);
    border-radius:9px;padding:9px 12px;font-size:13.5px;cursor:pointer;width:100%;
    font-family:inherit;color:var(--fg);
  }
  .dirpick:hover{border-color:var(--acc);}
  .dirpick .p{flex:1;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  /* ══ 时间线 ══ */
  .tl{position:relative;padding-left:26px;}
  .tl::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1.5px;background:var(--line);}
  .ev{position:relative;padding-bottom:19px;}
  .ev:last-child{padding-bottom:0;}
  .ev::before{content:"";position:absolute;left:-24px;top:5px;width:9px;height:9px;border-radius:50%;
    background:var(--surface3);border:2px solid var(--bg);box-shadow:0 0 0 1.5px var(--line2);}
  .ev.me::before{background:var(--acc);box-shadow:0 0 0 1.5px var(--acc);}
  .ev.ask::before{background:var(--warn);box-shadow:0 0 0 1.5px var(--warn);}
  .ev.ok::before{background:var(--ok);box-shadow:0 0 0 1.5px var(--ok);}
  .ev .who{font-size:12px;color:var(--dim);margin-bottom:3px;}
  .ev .who b{color:var(--fg2);font-weight:600;}
  .ev .say{font-size:14px;line-height:1.6;}
  .ev .q{background:var(--surface2);border-left:2px solid var(--acc);border-radius:0 var(--r-sm) var(--r-sm) 0;
    padding:9px 12px;margin-top:7px;font-size:13.5px;color:var(--fg2);line-height:1.6;}
  .cmt{
    display:inline-flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;
    background:rgba(201,154,232,.1);border:1px solid rgba(201,154,232,.26);color:#cbb0dd;
    padding:4px 10px;border-radius:8px;
  }
  .cmt code{font:11.5px ui-monospace,Consolas,monospace;color:#e0c8f0;}

  /* ══ 审批卡 ══ */
  .ask-card{border-left:3px solid var(--danger);}
  .ask-card .what{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:10px 12px;margin-top:11px;font-size:13.5px;color:var(--fg2);line-height:1.6;}
  .ask-card .what code{font:12.5px ui-monospace,Consolas,monospace;background:#0a0d12;color:#e0b87a;
    padding:1.5px 6px;border-radius:5px;border:1px solid var(--line);word-break:break-all;}
  .ask-card .why{font-size:12.5px;color:var(--dim);margin-top:9px;display:flex;gap:6px;}
  .ask-card .why::before{content:"⚖";opacity:.65;}

  /* ══ 底栏输入 ══ */
  .composer{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);flex:none;background:var(--bg);}
  body.mode-desktop .composer{padding:13px 24px 18px;}
  body.mode-desktop .composer > div{max-width:800px;margin:0 auto;width:100%;display:flex;gap:8px;}
  .composer input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;
    padding:12px 14px;color:var(--fg);font:inherit;font-size:14px;min-width:0;}
  .composer input:focus{outline:none;border-color:var(--acc);}
  .composer input::placeholder{color:var(--dim);}
  .send{background:var(--acc);border:0;color:#fff;border-radius:11px;padding:0 17px;
    font:inherit;font-weight:600;font-size:14px;cursor:pointer;flex:none;}

  /* ══ 资料库 ══ */
  .tabs{display:flex;gap:5px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;}
  body.mode-desktop .tabs{padding:11px 24px;}
  .tabs button{
    font:inherit;font-size:13px;background:none;border:0;color:var(--dim);padding:7px 12px;
    border-radius:8px;cursor:pointer;white-space:nowrap;font-family:inherit;
  }
  .tabs button:hover{color:var(--fg);}
  .tabs button.on{background:var(--surface3);color:var(--fg);font-weight:600;}

  .rgroup{margin-bottom:15px;}
  .rgroup .hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .rgroup .hd b{font-size:14px;font-weight:650;}
  .rgroup .hd span{font-size:12px;color:var(--dim);}
  .rgroup .bd{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
  .rgroup.allow .bd{border-color:rgba(63,191,127,.22);}
  .rgroup.deny .bd{border-color:rgba(232,105,95,.22);}
  .ritem{display:flex;align-items:flex-start;gap:11px;padding:12px 15px;font-size:14px;}
  .ritem + .ritem{border-top:1px solid var(--line);}
  .ritem .sym{flex:none;width:18px;text-align:center;font-size:14px;line-height:1.5;}
  .rgroup.allow .sym{color:var(--ok);} .rgroup.ask .sym{color:var(--warn);} .rgroup.deny .sym{color:var(--danger);}
  .note{font-size:12.5px;color:var(--dim);line-height:1.7;padding:12px 14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);}

  .pitem{padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;}
  .pitem:last-child{border-bottom:0;}
  .pitem:hover{background:var(--surface2);}
  .pitem .nm{font-size:14px;font-weight:600;}
  .pitem .pv{font-size:12.5px;color:var(--dim);margin-top:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}

  /* ══ 版本记录 ══ */
  .filt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px;}
  .rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px;}
  .rev .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;}
  .rev .hd b{font-size:14.5px;font-weight:650;}
  .rev .sub{font-size:12.5px;color:var(--dim);}
  .rev .msg{
    font-size:13.5px;color:var(--fg);margin:9px 0 0;padding:9px 12px;background:var(--bg);
    border:1px solid var(--line);border-radius:var(--r-sm);border-left:2px solid var(--git);
  }
  .rev .files{margin-top:9px;font-size:12.5px;}
  .rev .f{display:flex;align-items:center;gap:9px;padding:4px 0;color:var(--fg2);}
  .rev .f code{font:12px ui-monospace,Consolas,monospace;color:var(--fg2);flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rev .f .d{font:11.5px ui-monospace,Consolas,monospace;flex:none;}
  .rev .plus{color:var(--ok);} .rev .minus{color:var(--danger);}
  .rev .acts{display:flex;gap:8px;margin-top:11px;}
  .daymark{font-size:12px;color:var(--dim);margin:18px 0 9px;display:flex;align-items:center;gap:9px;}
  .daymark:first-child{margin-top:2px;}
  .daymark .rule{flex:1;height:1px;background:var(--line);}

  .empty{text-align:center;padding:52px 24px;color:var(--dim);}
  .empty .big{font-size:32px;margin-bottom:12px;opacity:.5;}
  .empty h4{margin:0 0 7px;color:var(--fg2);font-size:15px;font-weight:600;}
  .empty p{margin:0;font-size:13px;line-height:1.7;}

  .toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);
    background:var(--surface3);border:1px solid var(--line2);color:var(--fg);
    padding:11px 17px;border-radius:11px;font-size:13.5px;z-index:60;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:.2s;max-width:86%;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .toast.ok{border-color:rgba(63,191,127,.5);} .toast.no{border-color:rgba(232,105,95,.5);}
</style>
</head>
<body class="mode-phone">

<div class="demobar">
  <span class="tag">演示</span>
  <button class="demo-btn on" id="dPhone" onclick="setMode('phone')">📱 手机</button>
  <button class="demo-btn" id="dDesk" onclick="setMode('desktop')">🖥 电脑</button>
  <span class="sep"></span>
  <button class="demo-btn" id="dLock" onclick="cycleLock()">锁：手机持有</button>
  <button class="demo-btn" id="dNet" onclick="toggleNet()">模拟：电脑离线</button>
  <button class="demo-btn" onclick="location.reload()">↺ 重置</button>
</div>

<div class="device">
  <div class="col">
    <div class="appbar" id="appbar"></div>

function toggleWfCommit(id){
  if(!holdsLock()) return needLock();
  const w = WFS.find(x=>x.id===id); w.autoCommit = !w.autoCommit; render();
  toast(w.autoCommit ? '已打开：每改完一轮自动提交' : '已关掉自动提交，改完要你自己提交');
}
function sayWf(){
  if(!holdsLock()) return needLock();
  const el = $('#ci'); const v = (el.value||'').trim();
  if(!v){ toast('先写一句再发'); return; }
  WFS.find(x=>x.id===U.wf).events.push({who:'你', cls:'me', t:'刚刚', say:v});
  WFS.find(x=>x.id===U.wf).events.push({who:'小马', cls:'', t:'刚刚', say:'收到，我这就去做。'});
  render(); toast('已插进对话', 'ok');
}
function needLock(){ toast('先抢到锁才能操作，这个工作流现在归另一台设备', 'no'); }

/* ══ 模块二：CCRemote ══ */
function renderRemote(){
  const c = CONVS.find(x=>x.id===U.conv);
  bar('CCRemote', '会话', 'portal', listToggleBtn());

  $('#screen').innerHTML =
    '<div class="split ' + (U.conv ? 'onlydetail' : 'onlylist') + (U.listOpen ? '' : ' nolist') + '">' +
      '<div class="pane-list">' +
        '<div class="listhead"><b>会话</b>' +
          '<button class="lbtn" title="收起列表" onclick="toggleList()">«</button>' +
        '</div>' +
        CONVS.map(x=>
        '<div class="litem ' + (x.id===U.conv?'on':'') + '" onclick="U.conv=\'' + x.id + '\';render();scrollUp()">' +
        '<div class="nm">' + x.name + '</div>' +
        '<div class="sb"><span class="pill ' + (x.state==='done'?'dim':x.state==='run'?'acc':'warn') + '">' + x.stateText + '</span></div></div>').join('') +
        '<div style="padding:13px 15px"><button class="btn sm" style="width:100%" onclick="toast(\'新建会话：选一个项目文件夹，然后说第一句\')">＋ 新建会话</button></div>' +
      '</div>' +
      '<div class="pane-detail">' + (c ? remoteDetail(c) : '') + '</div>' +
    '</div>';
}

function remoteDetail(c){
  const done = c.state === 'done';
  return '<main class="pad"><div class="inner">' +

    '<div class="card">' +
      '<div class="row"><h3 class="t grow">' + c.name + '</h3>' +
      '<span class="pill ' + (done?'dim':'warn') + '">' + c.stateText + '</span></div>' +
      '<div class="meta" style="margin-top:7px">在「' + c.dir + '」里干活</div>' +
    '</div>' +

    (c.ask ? '<div class="card ask-card">' +
      '<div class="row"><span class="pill warn">需要你决定</span></div>' +
      '<h3 class="t" style="margin-top:9px">这个动作要不要放行？</h3>' +
      '<div class="what">' + c.ask.what + '<div style="margin-top:8px"><code>' + c.ask.cmd + '</code></div></div>' +
      '<div class="why">' + c.ask.why + '</div>' +
      '<div class="acts"><button class="btn pri" style="flex:1" onclick="decide(\'allow\')">允许</button>' +
      '<button class="btn deny" style="flex:1" onclick="decide(\'deny\')">不允许</button></div>' +
    '</div>' : '') +

    '<div class="sechead"><b>对话</b><span class="rule"></span></div>' +
    '<div class="card"><div class="tl">' + c.events.map(evHtml).join('') + '</div></div>' +

    '<div class="drawer' + (U.drawer?' open':'') + '" style="margin-top:11px">' +
      '<button class="drawer-hd" onclick="toggleDrawer()">' +
        '<span class="chev">▶</span><span class="t">设置</span>' +
        '<span class="sum">' + shortDir(c.dir) + ' · ' + (c.autoCommit?'每轮自动提交':'不自动提交') + '</span>' +
        '<span class="tail">' + (U.drawer?'收起':'改配置') + '</span>' +
      '</button>' +
      '<div class="drawer-bd"><div class="step"><div class="grow">' +
        '<div class="lb">改完要不要自动提交</div>' +
        '<div class="chips">' +
          '<button class="chip ' + (c.autoCommit?'on':'') + '" onclick="toggleConvCommit(\'' + c.id + '\')">' +
            (c.autoCommit ? '每轮自动提交 ✓' : '不自动提交') + '</button>' +
        '</div>' +
        '<div class="meta" style="margin-top:8px">小马在「' + shortDir(c.dir) + '」里改完就提交一个 commit，改坏了能在「规则与资料 → 版本记录」里找回。</div>' +
      '</div></div></div>' +
    '</div>' +

  '</div></main>' +
  (done ? '' : '<div class="composer"><div><input id="ci" placeholder="' +
    (c.state==='wait' ? '回小马一句…' : '再交代一句…') + '">' +
    '<button class="send" onclick="sayConv()">发</button></div></div>');
}

function decide(v){
  const c = CONVS.find(x=>x.id===U.conv);
  c.ask = null;
  const ok = v === 'allow';
  c.events.push({who:'你', cls:'me', t:'刚刚', say: ok ? '可以，删吧' : '先别删，换个办法验证'});
  if(ok){
    c.events.push({who:'小马', cls:'ok', t:'刚刚', say:'删好了，构建跑通，导出乱码的问题也验证修好了。'});
    c.state='done'; c.stateText='已完成';
  }
  render(); toast(ok ? '已放行，小马接着干了' : '已拒绝，小马会来问你怎么办', ok?'ok':'no');
}

function sayConv(){
  const el = $('#ci'); const v = (el.value||'').trim();
  if(!v){ toast('先写一句再发'); return; }
  const c = CONVS.find(x=>x.id===U.conv);
  c.events.push({who:'你', cls:'me', t:'刚刚', say:v});
  c.events.push({who:'小马', cls:'', t:'刚刚', say:'明白了，我按这个口径继续。'});
  c.state='run'; c.stateText='干活中';
  render(); scrollUp(); toast('已发给小马', 'ok');
}
function toggleConvCommit(id){
  const c = CONVS.find(x=>x.id===id); c.autoCommit = !c.autoCommit; render();
  toast(c.autoCommit ? '已打开：每改完一轮自动提交' : '已关掉自动提交');
}

/* ══ 模块三：规则与资料 ══ */
const LIBTABS = [['rules','审批规则'],['prompts','提示词'],['projects','项目'],['commits','版本记录']];
function renderLib(){
  bar('规则与资料', '所有活儿共用的底子', 'portal');
  $('#screen').innerHTML =
    '<div class="tabs">' + LIBTABS.map(([k,n])=>
      '<button class="' + (U.libTab===k?'on':'') + '" onclick="U.libTab=\'' + k + '\';render()">' + n + '</button>').join('') + '</div>' +
    '<main class="pad"><div class="inner">' +
      ({rules:libRules, prompts:libPrompts, projects:libProjects, commits:libCommits})[U.libTab]() +
    '</div></main>' +
    '<div class="composer"><div><input placeholder="用一句话加一条…">' +
    '<button class="send" onclick="toast(\'已加上，立刻对所有任务生效\')">加</button></div></div>';
}

function libRules(){
  const g = (key, sym, title, sub) =>
    '<div class="rgroup ' + key + '"><div class="hd"><span>' + sym + '</span><b>' + title + '</b><span>' + sub + '</span></div>' +
    '<div class="bd">' + RULES[key].map(r=>
      '<div class="ritem"><span class="sym">' + (key==='allow'?'·':key==='ask'?'?':'×') + '</span>' +
      '<div class="grow"><div>' + r.t + '</div><div class="meta" style="margin-top:2px">' + r.d + '</div></div></div>').join('') +
    '</div></div>';
  return g('allow','○','自动放行','小马直接做，不打扰你') +
    g('ask','◐','每次问我','停下来等你点头') +
    g('deny','●','直接拒绝','碰都不碰') +
    '<div class="note">这三条对<b>所有</b>任务都生效 —— 不管是 CCRemote 里你下的指令，还是多AI 协同里 GPT 下的。<br>' +
    '改完立刻生效，正在跑的任务也会用新规则。</div>';
}

function libPrompts(){
  return '<div class="plist">' + PROMPTS.map(p=>
    '<div class="pitem" onclick="toast(\'' + esc(p.n) + '：' + esc(p.v) + '\')">' +
    '<div class="row"><div class="nm grow">' + p.n + '</div>' +
    '<span class="pill dim">用过 ' + p.used + ' 次</span></div>' +
    '<div class="pv">' + p.v + '</div></div>').join('') + '</div>' +
    '<div class="note" style="margin-top:11px">这些提示词在「多AI 协同」里选，也可以临时自己写一句。<br>' +
    '库里改了，下次用就是新的。</div>';
}

function libProjects(){
  return PROJECTS.map(p=>'<div class="card">' +
    '<div class="row"><h3 class="t grow">' + p.n + '</h3>' +
    '<span class="pill ' + (p.commit?'ok':'dim') + '">' + (p.commit?'自动提交 · 开':'自动提交 · 关') + '</span></div>' +
    '<div class="meta" style="margin-top:6px;font-family:ui-monospace,Consolas,monospace;font-size:12px">' + p.p + '</div>' +
    '<div class="meta">常用提示词：' + p.prompt + ' · 上次干活：' + p.last + '</div>' +
    '</div>').join('') +
    '<div class="note">在这里给每个项目定好默认：在哪儿干活、用哪句提示词、要不要自动提交。<br>新开任务时就不用每次重选一遍。</div>';
}

/* 版本记录 —— 每次调整改了什么，都在这儿 */
function libCommits(){
  let html = '<div class="filt">' +
    '<button class="chip on">全部项目</button>' +
    PROJECTS.map(p=>'<button class="chip" onclick="toast(\'只看「' + esc(p.n) + '」的改动\')">' + p.n + '</button>').join('') +
    '</div>';

  let lastDay = null;
  COMMITS.forEach(r=>{
    if(r.day !== lastDay){
      html += '<div class="daymark"><span>' + r.day + '</span><span class="rule"></span></div>';
      lastDay = r.day;
    }
    html += '<div class="rev">' +
      '<div class="hd"><b>' + r.task + '</b>' +
      '<span class="pill dim">' + r.from + '</span></div>' +
      '<div class="sub">' + r.proj + ' · ' + r.time + ' · ' + r.total + ' · <code style="font-family:ui-monospace,Consolas,monospace">' + r.c + '</code></div>' +
      '<div class="msg">' + r.msg + '</div>' +
      '<div class="files">' + r.files.map(f=>{
        const [plus, minus] = f[1].split(' ');
        return '<div class="f"><code>' + f[0] + '</code>' +
          '<span class="d"><span class="plus">' + plus + '</span> <span class="minus">' + minus + '</span></span></div>';
      }).join('') + '</div>' +
      '<div class="acts">' +
        '<button class="btn sm" onclick="toast(\'打开这一次的完整改动对照\')">看看改了什么</button>' +
        '<button class="btn sm deny" onclick="toast(\'会把项目退回到这一次提交的状态\')">回到这一版</button>' +
        '<button class="btn sm" onclick="toast(\'复制了 commit 号\')">复制编号</button>' +
      '</div></div>';
  });

  html += '<div class="note">每次小马改完目标项目，都会自动提交一次，这里能看到改了什么。<br>' +
    '改坏了想回退，从这儿找到对应那条就行。项目档案里可以关掉某个项目的自动提交。</div>';
  return html;
}

render();
</script>
</body>
</html>
